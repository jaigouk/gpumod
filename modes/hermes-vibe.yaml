# =============================================================================
# Hermes + VibeThinker 4-role mode (gpumod-4rbc, 2026-06-26).
#
# Co-resident daily driver + 4-role reasoning specialist, both GPU-resident:
#
#   :7107  gemma4-12b-q5             Gemma 4 12B IT Q5_K_M, 131K ctx, text-only.
#                                    "Good enough" daily driver for Hermes/
#                                    Telegram chat + research / knowledge-base
#                                    RAG. (~10.5 GB)
#   :7115  vibethinker-3b-q8-multi4  VibeThinker-3B Q8 x4 cont-batching slots,
#                                    98K ctx each, for best-of-N on verifiable
#                                    single-shot reasoning. The 4 roles —
#                                    tech-lead / researcher / developer / QA —
#                                    are per-request SYSTEM PROMPTS on this one
#                                    service (same model, different persona), NOT
#                                    separate processes. (~10.1 GB)
#
# Total ~20.6 GB on the 24 GB 4090 -> ~3.5 GB free, above this host's 1.5 GB
# freeze floor (docs/research/20260525_oom_protection_findings). Live-measured
# at the prior 3-slot ctx: 16.3 GB used / 7.8 GB free; this 4x98K variant has the
# SAME KV footprint as 3x131K (393216 total either way).
#
# Dispatch: scripts/vibethinker_dispatch.py sends a task to :7115 with a chosen
# role's system prompt, fires N concurrent samples (best-of-N), and strips
# <think> before returning the final answers. gpumod only serves the ports.
#
# Embeddings: headroom CPU-only ONNX (NO GPU co-tenant), same as hermes-agent.
#
# WHY 12B not 26B: the 26B-A4B-QAT-MTP daily driver (hermes-agent mode) is 22 GB
# and cannot fit alongside VibeThinker on 24 GB. The 26B stays one switch away in
# `hermes-agent` mode (vision / 256K / 99.3 coding) for tasks that need it.
#
# 4 x FULL-131K instead of 4x98K: fits standalone (~12 GB) but not co-resident
# with the 12B (~1.4 GB free, under floor). For that, run a VibeThinker-only mode
# (multi4 ctx 524288, no 12B) or trim the 12B to 64K. See the multi4 preset header.
#
# Heavyweight escape hatch: `gpumod mode switch hermes-agent` for the 26B.
# =============================================================================
id: hermes-vibe
name: Hermes + VibeThinker 4-role
description: >-
  Gemma 4 12B Q5 daily driver (:7107) for Hermes/Telegram chat + research/RAG,
  co-resident with VibeThinker-3B Q8 x4 best-of-N specialist (:7115, 98K/slot).
  Roles tech-lead/researcher/developer/QA are per-request system prompts (see
  scripts/vibethinker_dispatch.py). ~20.6 GB, ~3.5 GB free. Embeddings via
  headroom CPU-only ONNX. Switch to hermes-agent for the 26B heavyweight.
services:
  - gemma4-12b-q5
  - vibethinker-3b-q8-multi4
