id: code
name: Code Mode
description: >-
  Coding mode with Gemma 4 26B-A4B (UD-IQ4_XS, single-agent) — perfect
  100/100 on the v2 coding benchmark (gpumod-h6gs) — plus Qwen3-Embedding-0.6B
  for code embedding. Trade-off vs the prior qwen3-coder-multi-p3 slot —
  single-agent (parallel 1) instead of 3 concurrent slots; fine for one
  coding session at a time, regression if you run multiple concurrent coding
  tabs or tool-calling agents. To restore multi-agent, introduce a
  gemma4-26b-a4b-q4-multi preset (parallel 3 + cont-batching) and swap.
services:
  - vllm-embedding-code
  - gemma4-26b-a4b-q4
