id: code
name: Code Mode
description: >-
  Coding mode with Gemma 4 26B-A4B (UD-IQ4_XS) in multi-agent configuration —
  N=3 slots, 128K context each (text-only), cont-batching. 132 TPS aggregate,
  supports the TL + Dev + QA tool-heavy workflow (gpumod-8xaq Phase 2). Plus
  Qwen3-Embedding-0.6B for code embedding. Text-only — for image/diagram
  review fall back to the gemma4-26b-a4b-q4 single-slot preset.
services:
  - gguf-embedding-code
  - gemma4-26b-a4b-q4-multi
