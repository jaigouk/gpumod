# =============================================================================
# Hermes Agent mode (k3s-setup-b4t, 2026-06-06; QAT swap 2026-06-07;
# MTP swap 2026-06-10, gpumod-z0ks; multi-slot evaluated and rolled BACK
# 2026-06-14 — see "Multi-slot rollback" below).
#
# Boots the single-slot Gemma 4 26B-A4B QAT+MTP preset
# (gemma4-26b-a4b-qat-mtp-q4, port 7110, 256K context) and the
# Qwen3-Embedding-0.6B reranker. Used by the orchestrator hermes
# profile only — worker-a / worker-b systemd units remain stopped +
# disabled because host RAM (30 GiB) couldn't sustain 3 separate
# hermes profile processes + their KV caches + side workloads
# (ComfyUI, qmd hybrid queries, honcho).
#
# Multi-slot rollback rationale (2026-06-14): the multi-slot
# preset (gemma4-26b-a4b-qat-mtp-q4-multi, port 7114, parallel=3 at
# 64K/slot) is empirically validated (gpumod-mqxg + gpumod-knlw;
# aggregate ~506 TPS, 3-agent dialogue quality preserved) but
# 64K per slot is NOT enough for real coding workloads — hermes-agent
# loads many skills as system prompt (10-50K tokens) plus repo files
# plus accumulating tool-call results, easily 60-80K+ in a typical
# coding session. 128K per slot (96K with embeddings co-tenant) was
# also too tight. The multi-slot preset stays in the repo as a
# dormant candidate for future hermes-agent gateways that prefer
# concurrency over per-session depth (e.g. multi-user fan-out where
# each conversation is short). For the current orchestrator profile
# (single deep agent session per conversation), single-slot 256K
# is the right shape.
#
# QAT swap rationale (gpumod-rjkx, 2026-06-07): Unsloth QAT-derived
# Gemma 4 26B-A4B-it-qat-UD-Q4_K_XL matches imatrix UD-IQ4_XS
# baseline on quality (100/100 σ=0 over 15 iters on the v2 coding
# suite) at +20% TPS (168.9 vs 140.7) for +1.9 GB VRAM / +1.55 GB
# disk. Full write-up:
# docs/benchmarks/20260606_gemma4_26b_qat_vs_imatrix/README.md.
#
# MTP swap rationale (gpumod-z0ks, 2026-06-10): adds the Unsloth
# Q8_0 MTP drafter (462 MB) for multi-token speculative decoding.
# Single-slot smoke acceptance 91.7%. Requires llama.cpp >= PR#23398
# (2026-06-07); host build fd3271e0b verified.
#
# Context restored to 256K (2026-06-14): native max for Gemma 4
# 26B-A4B per Unsloth's QAT page — no rope scaling needed. Replaces
# the conservative 131K choice from the initial MTP swap. Trade-off:
# tighter VRAM headroom (~2.3 GiB under ceiling with embeddings
# co-tenant, vs ~3.6 GiB at 131K) — acceptable for text-heavy
# coding workloads. Drop to 192K if multi-image conversations
# sustained-OOM.
#
# Multi-slot history (do NOT re-enable separate worker-a/worker-b
# hermes profiles without revisiting RAM headroom — the constraint
# is hermes process RAM, not LLM slot count):
#   * Prior preset gemma4-26b-a4b-q4-multi (non-MTP, port 7109) ran
#     parallel=3 + cont-batching at 128K per slot — 132 TPS aggregate.
#     Capacity research:
#       docs/research/20260604_multi_agent_hermes_capacity/README.md
#   * MTP multi-slot study + 3-agent validation (the rolled-back path):
#       docs/research/20260610_mtp_multislot_gemma4/README.md
#       docs/research/20260610_mtp_multislot_gemma4/agent_smoke/FINDINGS.md
#   * Slot save/restore research (still relevant for any future
#     multi-slot revisit via POST /slots/{id}?action=save|restore):
#       docs/research/20260605_slot_persistence/README.md
# =============================================================================
id: hermes-agent
name: Hermes Agent Mode
description: >-
  Hermes Agent with Gemma 4 26B-A4B (QAT UD-Q4_K_XL) + MTP drafter, single-slot,
  multimodal, 256K ctx. Single-agent orchestrator profile only — worker trio
  collapsed to fit 30 GiB host RAM (k3s-setup-b4t). Plus Qwen3-Embedding-0.6B
  for memory/RAG.
services:
  - gemma4-26b-a4b-qat-mtp-q4
  - gguf-embedding-code
