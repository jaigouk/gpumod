# =============================================================================
# Single-agent Hermes mode (k3s-setup-b4t, 2026-06-06; QAT swap 2026-06-07;
# MTP swap 2026-06-10, gpumod-z0ks).
#
# Boots the single-slot Gemma 4 26B-A4B QAT+MTP preset
# (gemma4-26b-a4b-qat-mtp-q4) and the Qwen3-Embedding-0.6B reranker. Used by
# the orchestrator hermes profile only — worker-a / worker-b systemd units are
# stopped + disabled because host RAM (30 GiB) couldn't sustain the 3-slot KV
# cache + 3 hermes profiles + side workloads (ComfyUI, qmd hybrid queries,
# honcho).
#
# QAT swap rationale (gpumod-rjkx, 2026-06-07): the Unsloth QAT-derived
# Gemma 4 26B-A4B-it-qat-UD-Q4_K_XL GGUF matches the prior imatrix UD-IQ4_XS
# baseline on quality (100/100 σ=0 over 15 iters on the v2 coding suite) and
# runs +20 % TPS (168.9 vs 140.7) for +1.9 GB VRAM / +1.55 GB disk. Full
# write-up: docs/benchmarks/20260606_gemma4_26b_qat_vs_imatrix/README.md.
#
# MTP swap rationale (gpumod-z0ks, 2026-06-10): adds the Unsloth Q8_0 MTP
# drafter (462 MB) for multi-token speculative decoding. Reported uplift
# 1.4-2.2x on GGUFs; RTX 4090 measurement is a follow-up. Cost: ctx 262144
# → 131072 to free KV headroom for the drafter (128K still covers all
# realistic agent workloads here). vram_mb 22500 → 22000 to satisfy
# preflight RAMCheck's +1500 MB MTP overhead allowance. Requires
# llama.cpp >= PR#23398 (2026-06-07); host build fd3271e0b verified.
#
# Multi-slot history (do NOT re-enable without revisiting RAM headroom):
#   * Prior preset gemma4-26b-a4b-q4-multi ran `--parallel 3 --cont-batching`
#     at 128K per slot — 132 TPS aggregate, only 7% TPS regression vs
#     single-slot. Capacity research:
#       gpumod/docs/research/20260604_multi_agent_hermes_capacity/README.md
#     Slot save/restore research (still useful for single-slot disconnects):
#       gpumod/docs/research/20260605_slot_persistence/README.md
#   * Single-slot preset is MULTIMODAL (carries --mmproj), unlike multi.
#     Image inputs work natively, ctx is 131072.
# =============================================================================
id: hermes-agent
name: Hermes Agent Mode
description: >-
  Hermes Agent with Gemma 4 26B-A4B (QAT UD-Q4_K_XL) + MTP drafter, single-slot,
  multimodal, 131K ctx. Single-agent orchestrator profile only — worker trio
  collapsed to fit 30 GiB host RAM (k3s-setup-b4t). Plus Qwen3-Embedding-0.6B
  for memory/RAG.
services:
  - gemma4-26b-a4b-qat-mtp-q4
  - gguf-embedding-code
