# =============================================================================
# How --parallel 3 actually works (read this before using):
#
# --parallel 3 in the llama-server backend creates THREE INDEPENDENT KV CACHE
# SLOTS, not three agents. An "agent" is any client that opens HTTP requests
# to the chat-completions endpoint; the model itself has no notion of "agent".
#
# To use 3 agents:
#   * Run 3 SEPARATE client processes (3 Claude Code tabs, 3 hermes sessions,
#     3 aider invocations, etc), each configured with the SAME base URL
#     `http://localhost:7109/v1`.
#   * llama-server's cont-batching scheduler routes each incoming request to
#     a free slot, first-come-first-served. No sticky agent-to-slot mapping.
#
# Conversation continuity:
#   * The server is STATELESS across requests. Each `/v1/chat/completions`
#     POST carries the full `messages: [...]` history.
#   * The prefix cache (radix tree) detects that the new request shares a
#     prefix with a slot's existing KV cache and reuses it — so multi-turn
#     conversations stay fast even though there is no agent→slot pinning.
#
# Concurrency behavior:
#   * 1-3 concurrent requests → all served in parallel, packed into the batch.
#   * 4+ concurrent requests → 4th queues until a slot frees (no blocking
#     for the first 3, just a wait for the 4th).
#   * Phase 2 measured 132 TPS aggregate at N=3 ctx=128K (Workflow A: TL +
#     Dev + QA) vs 109 TPS single-slot — cont-batching amortises memory
#     bandwidth across slots.
#
# Throughput cliff (gpumod-8xaq Phase 2):
#   * 128K per slot = sweet spot. Past 200K the attention compute over
#     allocated slot ctx collapses throughput (256K → 10 TPS, Dev never
#     finishes a turn). Do NOT bump ctx_size above 393216 (= 3 × 128K)
#     without measuring.
#
# Persistent agent memory (gpumod-8viu, --slot-save-path is enabled):
#   * Each slot's KV cache can be saved to disk and restored later so an
#     agent that disconnects and reconnects doesn't pay a full re-prefill.
#   * Endpoints (curl examples):
#       POST /slots/{id}?action=save     body: {"filename":"agent_A.bin"}
#       POST /slots/{id}?action=restore  body: {"filename":"agent_A.bin"}
#     Round-trip ~2-4 ms; ~120 KB/token on disk (bf16 full-precision dump).
#   * Wrapper pattern for "agent A leaves and comes back":
#       1. Before reconnect: POST /slots/0?action=restore
#       2. Normal chat: POST /v1/chat/completions with {"id_slot": 0, ...}
#       3. After response: POST /slots/0?action=save
#   * id_slot pinning works on /v1/chat/completions even though it is
#     undocumented (passthrough from /completion). Use it to keep the
#     same agent on the same slot file across sessions.
#   * DO NOT add --swa-full — it caused a host freeze on 2026-06-05 by
#     forcing full-ctx KV allocation on every Gemma 4 layer instead of
#     the 1024-token sliding window. Slot save/restore works correctly
#     without it (gpumod-8viu Phase 2 v3).
#
# Trade-off vs the single-slot preset:
#   * Text-only — drops --mmproj to free ~1.1 GiB VRAM for the 128K
#     headroom. For image inputs, switch back to `gemma4-26b-a4b-q4`.
#
# Full research write-ups:
#   docs/research/20260604_multi_agent_hermes_capacity/README.md (capacity)
#   docs/research/20260605_slot_persistence/README.md (slot save/restore)
# =============================================================================
id: hermes-agent
name: Hermes Agent Mode
description: >-
  Hermes Agent with Gemma 4 26B-A4B (UD-IQ4_XS) in multi-agent configuration —
  N=3 cont-batching slots, 128K per-slot ctx (text-only). 132 TPS aggregate,
  only 7% TPS regression vs single-slot (gpumod-8xaq Phase 2). Plus
  Qwen3-Embedding-0.6B for memory/RAG. See the comment block above for how
  to wire actual agents to the slots — `--parallel 3` doesn't auto-create
  agents, it creates slots that clients claim on a first-come basis.
services:
  - gemma4-26b-a4b-q4-multi
  - vllm-embedding-code
