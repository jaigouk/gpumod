# =============================================================================
# Single-agent Hermes mode (k3s-setup-b4t, 2026-06-06).
#
# Boots the single-slot Gemma 4 26B-A4B Q4 preset (gemma4-26b-a4b-q4) and the
# Qwen3-Embedding-0.6B reranker. Used by the orchestrator hermes profile only
# — worker-a / worker-b systemd units are stopped + disabled because host RAM
# (30 GiB) couldn't sustain the 3-slot KV cache + 3 hermes profiles + side
# workloads (ComfyUI, qmd hybrid queries, honcho).
#
# Multi-slot history (do NOT re-enable without revisiting RAM headroom):
#   * Prior preset gemma4-26b-a4b-q4-multi ran `--parallel 3 --cont-batching`
#     at 128K per slot — 132 TPS aggregate, only 7% TPS regression vs
#     single-slot. Capacity research:
#       gpumod/docs/research/20260604_multi_agent_hermes_capacity/README.md
#     Slot save/restore research (still useful for single-slot disconnects):
#       gpumod/docs/research/20260605_slot_persistence/README.md
#   * Single-slot preset is MULTIMODAL (carries --mmproj), unlike multi.
#     Image inputs work natively, ctx is 131072.
# =============================================================================
id: hermes-agent
name: Hermes Agent Mode
description: >-
  Hermes Agent with Gemma 4 26B-A4B (UD-IQ4_XS) single-slot, multimodal,
  131K ctx. Single-agent orchestrator profile only — worker trio collapsed
  to fit 30 GiB host RAM (k3s-setup-b4t). Plus Qwen3-Embedding-0.6B for
  memory/RAG.
services:
  - gemma4-26b-a4b-q4
  - gguf-embedding-code
