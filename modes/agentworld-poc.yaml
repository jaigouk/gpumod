# AgentWorld(sim) + Gemma(agent) co-host PoC mode (local-llm-lab qwen-5q6.1, 2026-06-25).
# P1 substrate: run the AgentWorld world-model as the simulated environment AND Gemma as the
# agent, simultaneously on the 4090, to rehearse the agent<->simulator loop. STEPS ONLY — IQ2
# simulates badly; production = Q8 AgentWorld + 26B-A4B-QAT on Colab (no gpumod there).
#
# VRAM: agentworld-35b-a3b-iq2xxs (~13 GB, :7111) + gemma4-e2b-qat-q4 (6 GB, :7113) = ~19 GB < 24 GB.
# Notebook: local-llm-lab/notebooks/agentworld_sim_agent_poc.ipynb (local default LAUNCH=connect).
# Runbook: local-llm-lab/.notes/run-agentworld-sim-agent-poc.md.
id: agentworld-poc
name: AgentWorld Sim + Gemma Agent (co-host PoC)
description: >-
  Qwen-AgentWorld-35B-A3B UD-IQ2_XXS simulator (:7111) + Gemma 4 E2B QAT UD-Q4_K_XL agent (:7113)
  co-hosted on the 4090 (~19 GB) for the P1 agent<->simulator loop PoC. Steps/procedure only;
  IQ2 simulates badly — production = Q8 + 26B on Colab.
services:
  - gemma4-e2b-qat-q4
  - agentworld-35b-a3b-iq2xxs
