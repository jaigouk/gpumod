# gpumod-scie: llama.cpp --embedding replacement for vllm-embedding-code on the
# 30 GiB host (k3s-setup-b4t). vLLM costs ~2.3 GB host RSS as fixed CUDA/Python
# overhead per process (API + engine workers split) — wasted on a 0.6B one-shot
# pooling workload. llama.cpp's single C++ process drops RSS to ~0.6-0.9 GB and
# cold-start to <5 s. See .notes/embedding-llamacpp-vs-vllm.md.
#
# Pooling: --pooling last is required for Qwen3-Embedding (last-token pooling).
# Matryoshka: server returns the full 1024-dim vector; callers must slice +
# L2-renormalize client-side (vLLM did this server-side via hf_overrides).
# Audit callers (hermes memory, code-embedding workflows) before treating this
# as a drop-in.
id: gguf-embedding-code
name: Qwen3-Embedding-0.6B (llama.cpp)
driver: llamacpp
port: 8210
vram_mb: 800
context_size: 4096
model_id: Qwen/Qwen3-Embedding-0.6B-GGUF
model_path: $HOME/bin/Qwen3-Embedding-0.6B-Q8_0.gguf
health_endpoint: /health
startup_timeout: 30
supports_sleep: false
sleep_mode: none
unit_vars:
  model_path: $HOME/bin/Qwen3-Embedding-0.6B-Q8_0.gguf
  context_size: 4096
  n_gpu_layers: -1
  flash_attn: true
  extra_args: "--embedding --pooling last --parallel 4 --threads 8"
