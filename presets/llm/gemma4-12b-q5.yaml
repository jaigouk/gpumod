# Gemma 4 12B IT Q5_K_M — for gpumod-h6gs benchmark.
# Source: unsloth/gemma-4-12b-it-GGUF
# Higher-quality quant than gemma4-12b-q4 (Q5_K_M, ~8.4 GB vs UD-Q4_K_XL ~7.4 GB).
# Used to measure "what's the best Gemma 4 12B can do in <10 GB" — Qwen at the same
# tier would be ~19 GB, so this lets Gemma use the headroom Qwen doesn't have.
# Same MTP / arch caveats as gemma4-12b-q4.

id: gemma4-12b-q5
name: Gemma 4 12B IT Q5_K_M
driver: llamacpp
port: 7107
vram_mb: 15000
context_size: 131072
kv_cache_per_1k: 16
model_id: unsloth/gemma-4-12b-it-GGUF
model_path: $HOME/bin/gemma-4-12b-it-Q5_K_M.gguf
health_endpoint: /health
startup_timeout: 180
supports_sleep: false
sleep_mode: none
preflight_required: true
unit_vars:
  model_path: $HOME/bin/gemma-4-12b-it-Q5_K_M.gguf
  context_size: 131072
  n_gpu_layers: -1
  jinja: true
  flash_attn: true
  extra_args: "--parallel 1 --threads 16 --cache-type-k q8_0 --cache-type-v q8_0 --chat-template-kwargs '{\"enable_thinking\":true}'"
