# VibeThinker-3B Q8_0 — multi-slot best-of-3 specialist (gpumod-4rbc).
#
# Three continuous-batching slots on ONE VibeThinker process. The 3.29 GB
# weights load once; each slot adds only KV cache. Same cont-batching pattern
# validated for Gemma in docs/research/20260604_multi_agent_hermes_capacity.
#
# WHY best-of-3: the gpumod-msy8 benchmark
# (docs/benchmarks/20260626_vibethinker_3b_vs_gemma4_26b_qat_mtp/README.md)
# measured sigma 15.45 — VibeThinker scored 100 and 40 on the SAME tasks at
# temp 1.0. README verdict: "never trust a single generation ... wrap it in a
# verifier or best-of-N." Live-confirmed 2026-06-26: on an AIME-style problem,
# slot 1 ran out of budget mid-reasoning (no answer) while slots 2+3 both
# returned the correct 738 -> majority vote recovered it. A single shot would
# have failed. This is the model's sweet spot: self-contained, verifiable,
# single-shot reasoning (math / coding / STEM). It is NOT a tool-calling /
# agent / composition model (card; bench L2/L5 collapse) — keep that on the
# daily driver.
#
# Architecture: dense Qwen2 (architectures=[Qwen2ForCausalLM], is_moe=false).
#   Native ChatML chat template -> --jinja, no --chat-template-kwargs.
#   GGUF: prithivMLmods/VibeThinker-3B-GGUF, $HOME/bin/VibeThinker-3B.Q8_0.gguf.
#
# SAMPLER — card-exact (https://huggingface.co/WeiboAI/VibeThinker-3B):
#   temp 1.0, top_p 0.95, top_k -1 (DISABLED), no presence/repetition penalty.
#   llama.cpp form of "top_k -1" is `--top-k 0` (0 / <=0 disables top-k). For
#   best-of-N this is doubly right: disabling top_k maximises sample diversity,
#   which is the whole point of drawing 3 samples. (The gpumod-msy8 bench
#   DEVIATED to top_k 20 to bound temp-1.0 degeneration; we now follow the card.
#   If you observe degeneration — repetition loops / runaway traces — at
#   unbounded top_k, re-introduce a bound e.g. --top-k 20 per that bench note.)
#
# CONTEXT — maximised without rope scaling (gpumod-4rbc, 2026-06-26):
#   The card's quick-start uses max_new_tokens=102400 to preserve full reasoning
#   trajectories. VibeThinker's native per-sequence context is 131072 (config.json,
#   verified via fetch_model_config). With --parallel 3, --ctx-size is the TOTAL
#   KV split across slots; each slot is an independent sequence capped at native
#   131072. So context_size 393216 = 3 x 131072 gives EACH slot the full native
#   131072 context — NO rope scaling, because no single sequence exceeds native.
#   That holds the card's 102400-token generation per slot with headroom for the
#   prompt. This is the maximum for 3 slots without YaRN.
#
#   GOING FURTHER (>131072 per slot) would require YaRN rope scaling
#   (--rope-scaling yarn --yarn-orig-ctx 131072 ...). The card gives NO
#   rope-scaling guidance, so treat that as [unverified for VibeThinker] and
#   validate quality before adopting. Trading slots for depth is the
#   rope-free alternative: --parallel 2 -> 196608/slot, --parallel 1 -> 393216
#   on one sequence (also needs YaRN past 131072).
#
#   CLIENT max_tokens: context is the server-side KV budget; the per-request
#   max_tokens still gates generation. To actually USE the long slots, set the
#   request max_tokens high (the card uses 102400). The gpumod-4rbc smoke run
#   truncated at a 16384 client cap even though slots had 40K — raise it.
#
# VRAM (measured + projected): live hermes-vibe co-tenant run measured ~1.9 GB
#   KV at 122880 total ctx (=> ~15.5 MB / 1k, hence kv_cache_per_1k: 16). At
#   393216 total: ~6.3 GB KV + 3.37 GB weights + ~0.5 GB scratch ~= ~10 GB
#   standalone. Co-resident with gemma4-12b-q5 (~11 GB real) that projects to
#   ~21 GB / ~3 GB free — above this host's 1.5 GB freeze floor but UNVALIDATED
#   at this ctx. VALIDATE on the next `gpumod mode switch hermes-vibe` with
#   nvidia-smi during a concurrent best-of-3 burst; if free drops below ~1.5 GB,
#   fall back to context_size 262144 (87K/slot) or run VibeThinker without the
#   12B co-resident. vram_mb 10000 is the realistic standalone peak (the
#   simulator's static budget is conservative — live co-tenant peak was 16.3 GB
#   total vs 22.5 GB declared at the prior ctx).
#
# <think> handling: VibeThinker emits <think>...</think> into message.content
#   (plain Qwen2 ChatML is content-only in llama.cpp; reasoning_content stays
#   empty even with --reasoning-format deepseek — verified 2026-06-26). The
#   caller's verifier must strip closed <think> spans before parsing the final
#   answer; no server flag does this.
#
# flash_attn required: --cache-type-v q8_0 (quantized V cache) needs flash attn.
#
# Port 7115 is shared with the single-slot vibethinker-3b-q8 preset (runtime-
#   mutually-exclusive, same base URL). Single slot stays for benchmarks /
#   one-shot calls; this multi3 is the best-of-3 serving config for hermes-vibe.

id: vibethinker-3b-q8-multi3
name: VibeThinker-3B Q8_0 Multi (N=3 best-of-3, full 131K/slot)
driver: llamacpp
port: 7115
vram_mb: 10000
context_size: 393216
kv_cache_per_1k: 16
model_id: prithivMLmods/VibeThinker-3B-GGUF
model_path: $HOME/bin/VibeThinker-3B.Q8_0.gguf
health_endpoint: /health
startup_timeout: 120
supports_sleep: false
sleep_mode: none
preflight_required: true
unit_vars:
  model_path: $HOME/bin/VibeThinker-3B.Q8_0.gguf
  context_size: 393216
  n_gpu_layers: -1
  jinja: true
  flash_attn: true
  extra_args: "--parallel 3 --cont-batching --threads 16 --cache-type-k q8_0 --cache-type-v q8_0 --temp 1.0 --top-p 0.95 --top-k 0"
