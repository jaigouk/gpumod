# Qwen3.6-35B-A3B-MTP UD-IQ4_XS — Multi-Token Prediction (speculative decoding)
# Source: unsloth/Qwen3.6-35B-A3B-MTP-GGUF
# Note: MoE architecture, 35B total / 3B active params. Matches the Hermes-agent
# baseline (qwen36-35b-a3b-iq4xs) architecture exactly; only difference is MTP.
# MTP gives ~1.5-2x speedup. Constraints: --parallel 1 required,
# --mmproj unsupported, needs llama.cpp >= b9297.
# Companion preset: qwen36-35b-a3b-iq4xs (non-MTP twin on port 7099).
#
# Local filename is renamed (`-MTP-` inserted) because the upstream repo stores
# the MTP gguf with the SAME filename as the non-MTP twin
# (Qwen3.6-35B-A3B-UD-IQ4_XS.gguf), which would collide in ~/bin/.

id: qwen36-35b-a3b-mtp-iq4xs
name: Qwen3.6-35B-A3B MTP IQ4_XS
driver: llamacpp
port: 7103
vram_mb: 22000
context_size: 32768
kv_cache_per_1k: 32
model_id: unsloth/Qwen3.6-35B-A3B-MTP-GGUF
model_path: $HOME/bin/Qwen3.6-35B-A3B-MTP-UD-IQ4_XS.gguf
health_endpoint: /health
startup_timeout: 180
supports_sleep: false
sleep_mode: none
preflight_required: true
unit_vars:
  model_path: $HOME/bin/Qwen3.6-35B-A3B-MTP-UD-IQ4_XS.gguf
  context_size: 32768
  n_gpu_layers: -1
  jinja: true
  flash_attn: true
  # --chat-template-kwargs explicit per Unsloth docs (default is true; explicit
  # documents intent and survives future template defaults). Cache type left
  # default (f16) since Unsloth's MTP guide does not recommend q8_0 cache
  # overrides; the non-MTP twin uses q8_0 but MTP compat with q8_0 is untested.
  extra_args: "--parallel 1 --threads 16 --spec-type draft-mtp --spec-draft-n-max 2 --chat-template-kwargs '{\"enable_thinking\":true}'"
