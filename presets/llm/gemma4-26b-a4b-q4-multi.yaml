# Gemma 4 26B-A4B Q4 Multi-Agent (N=3, ctx=128K per slot, text-only)
# MoE: 26B total, 4B active per token.
# Configuration chosen by the gpumod-8xaq capacity spike (Phase 2):
# the 128K-per-slot sweet spot — 132 TPS aggregate, only 7% TPS regression
# vs N=3 ctx=64K (142 TPS) but 2× the per-slot context. Past 200K per slot
# throughput collapses (256K → 10 TPS, Dev never finishes a turn). See
# docs/research/20260604_multi_agent_hermes_capacity/README.md.
#
# TEXT-ONLY by design: drops --mmproj to free ~1.1 GiB VRAM that the
# headroom budget needs. For image inputs, use the single-slot
# gemma4-26b-a4b-q4 preset instead.
#
# Source: unsloth/gemma-4-26B-A4B-it-GGUF
# Non-speculative; standalone variant (not the gemma-4-26B-A4B-it-assistant
# drafter pair).

id: gemma4-26b-a4b-q4-multi
name: Gemma 4 26B-A4B IT UD-IQ4_XS Multi-Agent (N=3, 128K per slot)
driver: llamacpp
port: 7109
# Empirical: ~22,260 MiB used at boot with vllm-embedding-code co-tenant.
# vllm-embedding-code is 2500 vram_mb on its own; we attribute the rest to
# this preset so the additive accounting (preset + embedding) stays under
# the 24 GiB RTX 4090 ceiling. 20000 + 2500 = 22500 ≈ measured 22260.
vram_mb: 20000
# Per-slot context. The systemd template multiplies by --parallel for -c.
context_size: 131072
kv_cache_per_1k: 8
model_id: unsloth/gemma-4-26B-A4B-it-GGUF
model_path: $HOME/bin/gemma-4-26B-A4B-it-UD-IQ4_XS.gguf
health_endpoint: /health
startup_timeout: 240
supports_sleep: false
sleep_mode: none
preflight_required: true
unit_vars:
  model_path: $HOME/bin/gemma-4-26B-A4B-it-UD-IQ4_XS.gguf
  # The systemd template fills -c with context_size; we override here with the
  # full multi-slot total (per_slot × parallel) so cont-batching has the room.
  context_size: 393216
  n_gpu_layers: -1
  jinja: true
  flash_attn: true
  # --parallel 3 + --cont-batching = the Phase 2 sweet spot.
  # No --mmproj on purpose (see header). q8_0 KV cache: ~8 MiB/1K per slot
  # at this ctx thanks to Gemma's 1024-token sliding-window attention.
  extra_args: "--parallel 3 --cont-batching --threads 16 --cache-type-k q8_0 --cache-type-v q8_0 --temp 1.0 --top-p 0.95 --top-k 64 --chat-template-kwargs '{\"enable_thinking\":true}'"
