# Gemma 4 E2B IT QAT UD-Q4_K_XL — standard (non-mobile) QAT tier, Unsloth-recommended.
# Dense Gemma 4 E2B (MatFormer + per-layer embeddings, ~2.3B effective / ~5.1B w/ embeddings).
# Source: unsloth/gemma-4-E2B-it-qat-GGUF -> gemma-4-E2B-it-qat-UD-Q4_K_XL.gguf (2.44 GiB).
#
# This is the RECOMMENDED quality tier (98.16% top-1; Unsloth: precisions above UD-Q4_K_XL
# degrade QAT accuracy). NOT the mobile repo's UD-Q2_K_XL (2-bit, 61 tensors at TQ2_0) —
# that mobile variant is degenerate on coding (rambles to the token cap). See
# https://unsloth.ai/docs/models/gemma-4/qat .

id: gemma4-e2b-qat-q4
name: Gemma 4 E2B IT QAT UD-Q4_K_XL
driver: llamacpp
port: 7113
vram_mb: 6000        # ~2.5 GB weights + KV at 128K + runtime; tiny model, ample headroom
context_size: 131072  # E2B max 128K; fits AgentWorldBench's largest prompts (web/os ~81K) -> full coverage
model_id: unsloth/gemma-4-E2B-it-qat-GGUF
model_path: $HOME/bin/gemma-4-E2B-it-qat-UD-Q4_K_XL.gguf
health_endpoint: /health
startup_timeout: 120
supports_sleep: false
sleep_mode: none
preflight_required: false  # gpumod-ecr: only required for vram_mb >= 10000; E2B is tiny
unit_vars:
  model_path: $HOME/bin/gemma-4-E2B-it-qat-UD-Q4_K_XL.gguf
  context_size: 131072
  n_gpu_layers: -1
  jinja: true
  flash_attn: true
  # Unsloth-recommended Gemma 4 sampling (temp 1.0, top_p 0.95, top_k 64);
  # benchmark runner overrides per-request via GEMMA_CODING.
  extra_args: "--parallel 1 --threads 16 --cache-type-k q8_0 --cache-type-v q8_0 --temp 1.0 --top-p 0.95 --top-k 64 --chat-template-kwargs '{\"enable_thinking\":true}'"
