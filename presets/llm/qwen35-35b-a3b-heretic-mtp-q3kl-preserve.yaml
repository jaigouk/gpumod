# Qwen3.5-35B-A3B heretic v2 uncensored — Native MTP Preserved Q3_K_L (gpumod-ojey)
# Source: llmfan46/Qwen3.5-35B-A3B-uncensored-heretic-v2-Native-MTP-Preserved-GGUF
#
# Cross-version + cross-quant candidate vs qwen36-35b-a3b-mtp-iq4xs-preserve.
# Quant rationale: heretic repo has no IQ4_XS. Q4_K_S (20.43 GB) does not fit
# alongside the MTP draft head + q8_0 KV at 131072 ctx on a 24 GB RTX 4090
# (preflight: 25012 MB required vs 24067 MB available). Falling back to
# Q3_K_L (18.65 GB) per gpumod-ojey design doc. Bit-width gap to the baseline
# (UD-IQ4_XS, ~4.25 bpw) widens: Q3_K_L is ~3.4 bpw. README must flag this.
#
# preserve_thinking:true mirrors the baseline so single-shot benchmark
# behavior is the dominant comparison axis.

id: qwen35-35b-a3b-heretic-mtp-q3kl-preserve
name: Qwen3.5-35B-A3B heretic MTP Q3_K_L (preserve_thinking)
driver: llamacpp
port: 7105
vram_mb: 21000
context_size: 131072
kv_cache_per_1k: 16
model_id: llmfan46/Qwen3.5-35B-A3B-uncensored-heretic-v2-Native-MTP-Preserved-GGUF
