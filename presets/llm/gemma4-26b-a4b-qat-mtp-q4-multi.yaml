# Gemma 4 26B-A4B IT QAT UD-Q4_K_XL + MTP, Multi-Agent (N=3, 64K per slot)
# Validation preset from gpumod-knlw / spike gpumod-mqxg Phase 2.
#
# Combines the QAT+MTP single-slot recipe with the hermes-trio multi-slot
# pattern. Empirically verified on RTX 4090 + llama.cpp fd3271e0b
# (2026-06-10): aggregate ~506 TPS across 3 slots at 64K/slot, VRAM peak
# 19.9 GiB (4.2 GiB headroom under 24 GiB ceiling), per-slot draft
# acceptance 76-82%. Full numbers:
# docs/research/20260610_mtp_multislot_gemma4/README.md.
#
# Key design choices (vs the single-slot QAT+MTP preset on port 7110):
#   * port 7114 — separate from production single-slot (7110). Both
#     presets can coexist as files but only ONE runs at a time (combined
#     VRAM exceeds 24 GiB). Production cut-over happens by mode swap.
#   * context_size 65536 per slot (was 131072 single-slot). Halving
#     per-slot ctx frees ~2 GiB to absorb MTP layer KV across 3 slots.
#   * unit_vars.context_size 196608 = per_slot × parallel (template
#     fills -c from this override; matches the q4-multi pattern).
#   * --spec-draft-n-max 4 — RTX 4090 sweet spot per gpumod-mqxg Phase 2
#     (contradicts the n-max=1 community guidance from slower GPUs;
#     RTX 4090 has the compute headroom for wider drafts).
#   * --cache-ram 4096 + --slot-save-path matches hermes-trio.md
#     recipe (k3s-setup/docs/hermes-trio.md). Slot persistence enables
#     POST /slots/{id}?action=save|restore for per-agent KV save/load.
#   * mmproj KEPT (unlike non-MTP multi). Spike confirmed parallel=3
#     + mmproj + MTP works on RTX 4090 / fd3271e0b. mmproj eats ~1.1
#     GiB but has effectively zero throughput cost when only doing text.
#     The qwen-MTP-sister "--mmproj unsupported" annotation is obsolete
#     for Gemma 4 on current llama.cpp builds.
#
# IMPORTANT: $HOME/.cache/llama-slots/ must exist before service start
# (mkdir -p ~/.cache/llama-slots once during host setup). Drafter file
# must be present: $HOME/bin/gemma-4-26B-A4B-it-Q8_0-MTP.gguf (462 MB).
#
# NOT YET VERIFIED (out of scope for the validation ticket):
#   * Real image-input round-trip with mmproj at parallel=3 (only the
#     mmproj LOAD path was verified; actual image inference is a follow-up)
#   * Long-context behavior (Phase 2 used 40-token prompts)
#   * Sustained load with slot churn (single-shot 3 concurrent only)
#   * Output quality vs non-MTP (MTP should be quality-neutral but
#     not directly compared on a coding eval suite yet)

id: gemma4-26b-a4b-qat-mtp-q4-multi
name: Gemma 4 26B-A4B IT QAT UD-Q4_K_XL + MTP Multi (N=3, 64K/slot)
driver: llamacpp
port: 7114
# Phase 2 measured peak 19.9 GiB at this config. +1.6 GiB headroom
# margin for image-token KV growth on multi-image conversations.
vram_mb: 21500
# Per-slot context. Template multiplies for -c via unit_vars override.
context_size: 65536
kv_cache_per_1k: 8
model_id: unsloth/gemma-4-26B-A4B-it-qat-GGUF
model_path: $HOME/bin/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
health_endpoint: /health
startup_timeout: 240
supports_sleep: false
sleep_mode: none
preflight_required: true
unit_vars:
  model_path: $HOME/bin/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
  # Multi-slot total ctx (per_slot × parallel) for cont-batching room.
  context_size: 196608
  n_gpu_layers: -1
  jinja: true
  flash_attn: true
  # --spec-draft-n-max 4 — RTX 4090 sweet spot per spike Phase 2.
  # --cache-ram 4096: host-RAM KV cache cap. --slot-save-path enables
  # /slots save/restore endpoints. Same Unsloth Gemma 4 sampler defaults
  # (temp 1.0, top_p 0.95, top_k 64). NO --swa-full (would force every
  # layer to full-ctx KV and blow past 24 GiB, see q4-multi preset header).
  extra_args: "--parallel 3 --cont-batching --threads 16 --cache-type-k q8_0 --cache-type-v q8_0 --cache-ram 4096 --slot-save-path $HOME/.cache/llama-slots --model-draft $HOME/bin/gemma-4-26B-A4B-it-Q8_0-MTP.gguf --spec-type draft-mtp --spec-draft-n-max 4 --temp 1.0 --top-p 0.95 --top-k 64 --mmproj $HOME/bin/gemma-4-26B-A4B-it-mmproj-BF16.gguf --chat-template-kwargs '{\"enable_thinking\":true}'"
