id: qwen3-coder-multi-p3
name: Qwen3-Coder-30B-A3B Multi-Agent (3 slots)
driver: llamacpp
port: 7070
vram_mb: 20000
context_size: 40960
health_endpoint: /health
startup_timeout: 120
supports_sleep: false
sleep_mode: none
model_id: Qwen/Qwen3-Coder-30B-A3B-Instruct-GGUF
unit_vars:
  # Direct model mode (no router) for multi-agent parallel processing
  model_path: $HOME/bin/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
  context_size: 40960
  n_gpu_layers: -1
  jinja: true
  # 3 concurrent sessions to match Qwen3.5 for fair comparison
  extra_args: "--parallel 3 --cont-batching --threads 16"
