# Gemma 4 E4B BF16 (full precision)
# Dense nano model, ~15GB VRAM - needs most of RTX 4090
# Source: unsloth/gemma-4-E4B-it-GGUF
#
# Aligned with the newer gemma4-12b/26b-a4b presets (2026-06-04): flash_attn,
# q8_0 KV cache compression, Unsloth sampling defaults, and Gemma 4 thinking
# mode kwarg. Context kept at 64K (operator's original choice) to preserve
# the historical VRAM budget; Gemma 4 E4B's max is 128K if you want to bump.

id: gemma4-e4b-bf16
name: Gemma 4 E4B BF16
driver: llamacpp
port: 7098
vram_mb: 16000
context_size: 65536
model_id: unsloth/gemma-4-E4B-it-GGUF
model_path: $HOME/bin/gemma-4-E4B-it-BF16.gguf
health_endpoint: /health
startup_timeout: 120
sleep_mode: none
preflight_required: true  # gpumod-ecr: vram_mb >= 10000
unit_vars:
  model_path: $HOME/bin/gemma-4-E4B-it-BF16.gguf
  context_size: 65536
  n_gpu_layers: -1
  jinja: true
  flash_attn: true
  # Unsloth-recommended sampling defaults for Gemma 4 (temp 1.0, top_p 0.95,
  # top_k 64). Benchmark runner overrides per-request via SamplerConfig.
  extra_args: "--parallel 1 --threads 16 --cache-type-k q8_0 --cache-type-v q8_0 --temp 1.0 --top-p 0.95 --top-k 64 --chat-template-kwargs '{\"enable_thinking\":true}'"
