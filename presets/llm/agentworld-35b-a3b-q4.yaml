# Qwen-AgentWorld-35B-A3B — Unsloth Dynamic UD-Q4_K_S (gpumod-qsgl, refreshed 2026-06-25).
# Arch: Qwen3_5MoeForConditionalGeneration / qwen35moe (hybrid Gated-DeltaNet + Gated-Attention).
#   40 layers = 10 × (3 × DeltaNet → 1 × Gated-Attention); full-attn every 4th block.
#   256 experts (8 routed + 1 shared), A3B active. head_count_kv=2. GGUF arch "qwen35moe"
#   (runtime supported since llama.cpp b7990). Card: https://huggingface.co/unsloth/Qwen-AgentWorld-35B-A3B-GGUF
#
# SOURCE SWITCH (2026-06-25): replaced the community gguf-my-repo quant
#   (gaoqianshen/...-Q4_K_M-GGUF) with the official Unsloth Dynamic 2.0 GGUF.
#
# NO --override-kv NEEDED — the conversion defect is FIXED in the Unsloth build.
#   Verified by inspecting the GGUF header directly (first 3 MB range-fetch, 2026-06-25):
#     qwen35moe.block_count = 40        (the gguf-my-repo file wrongly declared 41)
#     qwen35moe.nextn_predict_layers    = absent (no MTP layer declared)
#     declared tensors = 733, head_count_kv = 2, expert_count = 256
#   block_count=40 + no nextn key means the runtime loads blocks 0–39, all of which have
#   tensors → no "missing tensor blk.40.*" abort. The two --override-kv flags the old
#   gaoqianshen preset carried are therefore removed. (The model has no MTP either way.)
#
# QUANT CHOICE — UD-Q4_K_S over IQ4_XS / Q4_K_M / Q4_K_XL:
#   At context_size=131072 on the 24 GB 4090, UD-Q4_K_S is the quality/headroom sweet spot.
#   UD-Q4_K_S file is 19.46 GiB (20,893,015,296 B) — actually a touch smaller than the old
#   plain Q4_K_M (19.71 GiB) but Unsloth-Dynamic-calibrated. UD-Q4_K_M/XL also fit at 128K
#   but leave only ~2 GB headroom; UD-IQ4_XS (16.6 GiB) is the higher-headroom fallback if a
#   live VRAM check comes back tight.
#
# context_size=131072 (was 65536): AgentWorldBench web/os prompts run ~81K (truncated at
#   64K), and the model card advises >=128K for multi-turn world simulation (max 262144).
#   128K gives full AgentWorldBench coverage with room to spare.
#
# VRAM — ESTIMATE, NOT YET MEASURED on this quant/context. The old gaoqianshen Q4_K_M
#   measured 21361 MiB @ 64K (gpumod-qsgl.4). Extrapolating (UD-Q4_K_S is ~260 MiB smaller
#   weights, +~360 MiB KV for 2× context): ~21.0 GB @ 131072, ~3.3 GB headroom. VERIFY with
#   `gpumod service start agentworld-35b-a3b-q4` before any long bench; dial context or drop
#   to UD-IQ4_XS if free VRAM is below ~2 GB.

id: agentworld-35b-a3b-q4
name: Qwen-AgentWorld-35B-A3B UD-Q4_K_S
driver: llamacpp
port: 7111
vram_mb: 22000          # estimate (~21.0 GB) — preflight floor; verify via gpumod service start
context_size: 131072
kv_cache_per_1k: 16
model_id: unsloth/Qwen-AgentWorld-35B-A3B-GGUF
model_path: $HOME/bin/Qwen-AgentWorld-35B-A3B-UD-Q4_K_S.gguf
health_endpoint: /health
startup_timeout: 240
supports_sleep: false
sleep_mode: none
preflight_required: true  # gpumod-ecr: vram_mb >= 10000
unit_vars:
  model_path: $HOME/bin/Qwen-AgentWorld-35B-A3B-UD-Q4_K_S.gguf
  context_size: 131072
  n_gpu_layers: -1
  jinja: true
  # Unsloth card-recommended world-model sampling (temp 0.6 / top_p 0.95 / top_k 20);
  # a benchmark runner overrides these per-request. No --override-kv (defect fixed upstream).
  extra_args: "--parallel 1 --threads 16 --cache-type-k q8_0 --cache-type-v q8_0 --temp 0.6 --top-p 0.95 --top-k 20"
