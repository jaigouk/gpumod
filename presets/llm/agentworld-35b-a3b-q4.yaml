# Qwen-AgentWorld-35B-A3B Q4_K_M — load-test spike (gpumod-qsgl.2).
# Arch: Qwen3_5MoeForConditionalGeneration / qwen3_5_moe (hybrid Gated-DeltaNet).
#   40 layers = 10 × (3 × DeltaNet → 1 × Gated-Attention); full_attention_interval=4
#   (full-attn at blocks 3,7,…,39); 256 experts (8 routed + 1 shared), A3B active.
#   GGUF declares llama.cpp arch "qwen35moe" (runtime supported since b7990).
# Source: gaoqianshen/Qwen-AgentWorld-35B-A3B-Q4_K_M-GGUF
#   single file, 19.71 GiB / 21,166,758,816 B (download verified byte-exact).
#
# CONVERSION-DEFECT FIX (in extra_args below; file NEVER modified) — the gguf-my-repo
#   GGUF declares qwen35moe.block_count=41 + nextn_predict_layers=1 (40 transformer
#   layers + 1 MTP layer, per config.json mtp_num_hidden_layers=1) but emitted tensors
#   for blocks 0–39 only — the MTP layer was never written. As-shipped, the runtime
#   aborts on "missing tensor blk.40.attn_norm.weight". The two --override-kv flags in
#   extra_args correct the metadata IN MEMORY AT LOAD TIME (override-kv, not a file
#   patch) → conditional and per-preset only, so the hermes-agent/gemma4 daily driver is
#   unaffected. Verified load+generate on b9784 (8be759e6f). Loses only optional MTP
#   speculative decode. See gpumod-qsgl.2 and local-llm-lab/kb/sources/qwen-agentworld.md.
#
# context_size=65536 VERIFIED via gpumod service start (gpumod-qsgl.4, 2026-06-24):
# steady-state 21361 MiB used / 2721 MiB free on the 24 GB 4090 — fits with ~2.7 GB
# headroom. Chosen over a larger ceiling on purpose: it is 2× the coding suite's
# max_tokens=32768 (no truncation) and keeps VRAM headroom for a multi-hour run. KV is
# cheap here (only the 10 full-attention layers grow KV; head_count_kv=2), so higher
# contexts are likely possible but unnecessary; do not push to the edge for a long bench.

id: agentworld-35b-a3b-q4
name: Qwen-AgentWorld-35B-A3B Q4_K_M
driver: llamacpp
port: 7111
vram_mb: 23000
context_size: 65536
kv_cache_per_1k: 16
model_id: gaoqianshen/Qwen-AgentWorld-35B-A3B-Q4_K_M-GGUF
model_path: $HOME/bin/qwen-agentworld-35b-a3b-q4_k_m.gguf
health_endpoint: /health
startup_timeout: 240
supports_sleep: false
sleep_mode: none
preflight_required: true  # gpumod-ecr: vram_mb >= 10000
unit_vars:
  model_path: $HOME/bin/qwen-agentworld-35b-a3b-q4_k_m.gguf
  context_size: 65536
  n_gpu_layers: -1
  jinja: true
  # --override-kv pair = the conversion-defect fix (see header): tell the runtime there
  # are 40 regular layers and 0 MTP layers, matching what the file actually contains.
  # In-memory only; the GGUF is untouched and no other preset is affected.
  extra_args: "--parallel 1 --threads 16 --cache-type-k q8_0 --cache-type-v q8_0 --override-kv qwen35moe.block_count=int:40 --override-kv qwen35moe.nextn_predict_layers=int:0"
