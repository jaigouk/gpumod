# VibeThinker-3B Q8_0 — dense reasoning-tuned 3B (gpumod-msy8 benchmark).
#
# Architecture: dense Qwen2 (architectures=[Qwen2ForCausalLM], is_moe=false per
#   fetch_model_config). Lineage Qwen2.5-3B -> Qwen2.5-Coder-3B -> VibeThinker-3B.
#   Native ChatML chat template -> --jinja (embedded template), no
#   --chat-template-kwargs (VibeThinker has no enable_thinking toggle).
#
# Source weights: WeiboAI/VibeThinker-3B. GGUF: prithivMLmods/VibeThinker-3B-GGUF
#   File: $HOME/bin/VibeThinker-3B.Q8_0.gguf (3.29 GB, Q8_0 near-lossless).
#   Q8_0 chosen to isolate the architecture/size variable from quantization
#   noise vs the 26B QAT MoE baseline (gemma4-26b-a4b-qat-mtp-q4).
#
# Use-case caveat (model card): tuned for VERIFIABLE reasoning (math/coding/STEM),
#   NOT trained on tool-calling or autonomous-agent data. The v2 coding suite is
#   single-turn codegen scored by PytestValidator (not tool-calling), so the
#   comparison is legitimate; the bench README notes this caveat.
#
# Sampler (extra_args defaults below): card recommends temp 1.0 / top_p 0.95 /
#   top_k -1 (disabled). We set top_k 20 (project coding default) rather than
#   disabling it; the divergence is flagged in the bench README. The benchmark
#   runner overrides sampler per-request via SamplerConfig (VIBETHINKER_CODING),
#   so these are service defaults for non-benchmark use only.
#
# context_size 65536: well under the 131072 native max. Coding-suite prompts are
#   short; a smaller ctx keeps the VRAM floor low for the 3B. VibeThinker can
#   emit very long reasoning (quick-start uses max_new_tokens=102400), but the
#   suite caps max_tokens=32768, which fits comfortably in 64K.
#
# <think> handling (gpumod-msy8): VibeThinker emits <think>...</think> reasoning
#   into message.content and often drafts ```python fences INSIDE <think>. Its
#   plain Qwen2 ChatML template is a "content-only" chat format in llama.cpp, so
#   the reasoning is NOT split into reasoning_content — verified 2026-06-26 that
#   even --reasoning-format deepseek is a no-op here (reasoning_content stays
#   empty). The fix is runner-side: scripts/run_qwen36_benchmark.py strips closed
#   <think> blocks before extract_code so the post-</think> final answer is what
#   gets validated (NOT a draft fence from inside the reasoning). No server flag
#   is needed or effective for this; do not add --reasoning-format here.
#
# flash_attn required: --cache-type-v q8_0 (quantized V cache) needs flash
#   attention in llama.cpp, so flash_attn: true is mandatory here.
#
# vram_mb 6000 conservative: 3.29 GB weights + q8_0 KV at 64K + runtime. Preflight
#   RAMCheck (model x 1.1 + 1024 MB floor) applies unchanged.

id: vibethinker-3b-q8
name: VibeThinker-3B Q8_0
driver: llamacpp
port: 7115
vram_mb: 6000
context_size: 65536
kv_cache_per_1k: 64
model_id: prithivMLmods/VibeThinker-3B-GGUF
model_path: $HOME/bin/VibeThinker-3B.Q8_0.gguf
health_endpoint: /health
startup_timeout: 120
supports_sleep: false
sleep_mode: none
preflight_required: true
unit_vars:
  model_path: $HOME/bin/VibeThinker-3B.Q8_0.gguf
  context_size: 65536
  n_gpu_layers: -1
  jinja: true
  flash_attn: true
  extra_args: "--parallel 1 --threads 16 --cache-type-k q8_0 --cache-type-v q8_0 --temp 1.0 --top-p 0.95 --top-k 20"
