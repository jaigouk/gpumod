# Gemma 4 26B-A4B IT QAT UD-Q4_K_XL — added for gpumod-rjkx (QAT vs imatrix A/B).
# MoE: 26B total, 4B active per token. Same arch as gemma4-26b-a4b-q4; only the
# quant pipeline differs — this GGUF is built from
# google/gemma-4-26B-A4B-it-qat-q4_0-unquantized (Quantization-Aware Training),
# whereas gemma4-26b-a4b-q4 is post-hoc imatrix-calibrated.
#
# Source: unsloth/gemma-4-26B-A4B-it-qat-GGUF (single quant: UD-Q4_K_XL, 14.25 GB).
# Per Unsloth: "precisions higher than UD-Q4_K_XL degrade accuracy" for QAT.
#
# mmproj reuses the imatrix repo's BF16 vision encoder ($HOME/bin/gemma-4-26B-A4B-it-mmproj-BF16.gguf)
# to keep the multimodal path byte-identical across both arms of the A/B.
#
# Context bumped 131072 → 262144 on 2026-06-09 — per Unsloth's QAT page Gemma 4
# 26B-A4B supports up to 256K natively (no rope scaling needed). VRAM headroom
# absorbs the extra KV (theoretical +2 GiB at q8/q8; empirical lower due to
# Gemma's 1024-token sliding-window attention — only sink layers allocate
# full-ctx KV). vram_mb bumped 20500 → 22500 to keep additive accounting honest
# vs the 24 GiB ceiling (model 13.6 + mmproj 1.1 + KV ~3.6 + runtime ~0.8
# = ~19.1 GiB; budget set higher for safety + image-token KV growth on
# multi-image conversations).

id: gemma4-26b-a4b-qat-q4
name: Gemma 4 26B-A4B IT QAT UD-Q4_K_XL (multimodal, 256K ctx)
driver: llamacpp
port: 7110
# +2000 over the prior 131K-ctx setting to cover the wider KV footprint at 256K.
# Total still well under the 24 GiB ceiling.
vram_mb: 22500
context_size: 262144
kv_cache_per_1k: 16
model_id: unsloth/gemma-4-26B-A4B-it-qat-GGUF
model_path: $HOME/bin/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
health_endpoint: /health
startup_timeout: 240
supports_sleep: false
sleep_mode: none
preflight_required: true
unit_vars:
  model_path: $HOME/bin/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
  context_size: 262144
  n_gpu_layers: -1
  jinja: true
  flash_attn: true
  # Same Unsloth-recommended Gemma 4 defaults as the imatrix preset (temp 1.0,
  # top_p 0.95, top_k 64). Benchmark runner overrides per-request via SamplerConfig.
  # mmproj is the imatrix repo's BF16 file — Unsloth ships the same vision encoder
  # across both repos, and reusing the existing path keeps the comparison clean.
  extra_args: "--parallel 1 --threads 16 --cache-type-k q8_0 --cache-type-v q8_0 --temp 1.0 --top-p 0.95 --top-k 64 --mmproj $HOME/bin/gemma-4-26B-A4B-it-mmproj-BF16.gguf --chat-template-kwargs '{\"enable_thinking\":true}'"
