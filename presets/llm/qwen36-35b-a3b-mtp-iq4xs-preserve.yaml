# Qwen3.6-35B-A3B-MTP UD-IQ4_XS — preserve_thinking variant (A/B for gpumod-qgy)
# Source: unsloth/Qwen3.6-35B-A3B-MTP-GGUF
# Identical to qwen36-35b-a3b-mtp-iq4xs EXCEPT for --chat-template-kwargs:
# this preset uses preserve_thinking:true (keeps prior turns' <think> in
# conversation history), the sibling uses enable_thinking:true (drops prior
# <think>). Used to A/B whether preserve_thinking changes single-shot
# benchmark behavior (theoretical expectation: no change on first turn).

id: qwen36-35b-a3b-mtp-iq4xs-preserve
name: Qwen3.6-35B-A3B MTP IQ4_XS (preserve_thinking)
driver: llamacpp
port: 7104
vram_mb: 22000
context_size: 131072
kv_cache_per_1k: 16
model_id: unsloth/Qwen3.6-35B-A3B-MTP-GGUF
model_path: $HOME/bin/Qwen3.6-35B-A3B-MTP-UD-IQ4_XS.gguf
health_endpoint: /health
startup_timeout: 180
supports_sleep: false
sleep_mode: none
preflight_required: true
unit_vars:
  model_path: $HOME/bin/Qwen3.6-35B-A3B-MTP-UD-IQ4_XS.gguf
  context_size: 131072
  n_gpu_layers: -1
  jinja: true
  flash_attn: true
  # gpumod-ttk7: q8_0 KV cache + 131072 ctx to match Unsloth's "minimum 128K
  # for thinking capabilities" recommendation. q8_0 cache compat with MTP draft
  # head was previously flagged as untested — smoke verified 2026-05-25.
  # Cost: ~-15% TPS and ~-13pp draft acceptance vs f16 cache; benefit: 4x
  # context for multi-turn preserve_thinking and thinking-mode budget.
  # preserve_thinking:true keeps prior turns' <think> in conversation history.
  extra_args: "--parallel 1 --threads 16 --cache-type-k q8_0 --cache-type-v q8_0 --spec-type draft-mtp --spec-draft-n-max 2 --chat-template-kwargs '{\"preserve_thinking\":true}'"
