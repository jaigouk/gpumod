id: devstral-small-2
name: Devstral Small 2505
driver: vllm
port: 8000
vram_mb: 15000
context_size: 32768
kv_cache_per_1k: 64
model_id: mistralai/Devstral-Small-2505
health_endpoint: /health
startup_timeout: 120
supports_sleep: true
sleep_mode: l1
preflight_required: true  # gpumod-ecr: vram_mb >= 10000
unit_vars:
  gpu_mem_util: 0.9
  max_model_len: 32768

# gpumod-l20: driver venv compat (matches src/gpumod/compat/profiles/vllm-0.11.yaml).
# `gpumod doctor venv` enforces these at unit start; edit if your service
# uses a different venv.
compat:
  vllm: ">=0.11.0,<0.12"
  transformers: ">=4.55.2,<5.0"
  huggingface-hub: ">=0.34.0,<1.0"
  torch: ">=2.7.0,<3.0"
