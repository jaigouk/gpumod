# VibeThinker-3B Q8_0 — multi-slot 4-role specialist (gpumod-4rbc).
#
# FOUR continuous-batching slots on ONE VibeThinker process. The 3.29 GB weights
# load ONCE; each slot adds only KV cache. "4 VibeThinker agents" cost ~10 GB
# total, NOT 4 x 5 GB — separate processes would each re-load the weights in
# VRAM (the OS shares the file in RAM, the GPU does not). The 4 roles (tech-lead
# / researcher / developer / QA) are PER-REQUEST SYSTEM PROMPTS, not separate
# services — same model, different persona. See scripts/vibethinker_dispatch.py.
#
# WHY this is a reasoning specialist, not an agent: the gpumod-msy8 benchmark
# (docs/benchmarks/20260626_vibethinker_3b_vs_gemma4_26b_qat_mtp/README.md)
# measured sigma 15.45 (scored 100 and 40 on the SAME tasks at temp 1.0) and the
# card states it was NOT trained on tool-calling / agent / composition data.
# Hand it SELF-CONTAINED, VERIFIABLE, single-shot reasoning (math / coding /
# STEM). Wrap every use in best-of-N + a verifier (live-confirmed 2026-06-26: a
# single shot truncated with no answer while 2 others returned the correct 738).
# Tool-calling / multi-step composition belongs on the daily driver.
#
# Architecture: dense Qwen2 (architectures=[Qwen2ForCausalLM], is_moe=false).
#   Native ChatML chat template -> --jinja, no --chat-template-kwargs.
#   GGUF: prithivMLmods/VibeThinker-3B-GGUF, $HOME/bin/VibeThinker-3B.Q8_0.gguf.
#
# SAMPLER — card-exact (https://huggingface.co/WeiboAI/VibeThinker-3B):
#   temp 1.0, top_p 0.95, top_k -1 (DISABLED), no penalties. llama.cpp form of
#   "top_k -1" is `--top-k 0`. Disabling top_k also maximises sample diversity,
#   which is the point of best-of-N. (If you see degeneration at unbounded top_k
#   — repetition loops / runaway traces — re-introduce --top-k 20 per the bench.)
#
# CONTEXT — 4 slots at 98K each, sized for co-residency with gemma4-12b-q5:
#   context_size 393216 = 4 x 98304. Each slot is an independent sequence well
#   under the native 131072 max (no rope scaling). 98K comfortably holds any
#   single-shot reasoning trace (the card's quick-start uses 102400; real
#   problems finish far sooner — the AIME test took ~13K).
#
#   WHY NOT 4 x FULL 131072 (=524288 total)? It fits STANDALONE (~12.2 GB, ~12 GB
#   free) but co-resident with the 12B (~10.5 GB) it projects to ~1.4 GB free —
#   BELOW this host's 1.5 GB freeze floor (docs/research/20260525_oom_protection).
#   To run 4 x full-131K: either a VibeThinker-only mode (bump context_size to
#   524288, drop the 12B) or trim gemma4-12b-q5 to 64K ctx (~+1 GB). For the
#   co-resident hermes-vibe mode, 4 x 98K is the sweet spot: same ~10 GB / ~3.5 GB
#   free as the 3 x 131K config, plus a 4th agent.
#
#   CLIENT max_tokens still gates generation per request — set it high (the card
#   uses 102400) to actually use the slot depth. KV for the full context_size is
#   pre-allocated at load, so VRAM is fixed at boot regardless of tokens emitted.
#
# VRAM (measured + projected): live run measured ~15.5 MB/1k KV (hence
#   kv_cache_per_1k: 16). At 393216 total: ~6.1 GB KV + 3.37 GB weights + ~0.6 GB
#   scratch ~= ~10.1 GB standalone; co-resident with gemma4-12b-q5 (~10.5 GB)
#   projects to ~20.6 GB / ~3.5 GB free. vram_mb 10000 is the realistic standalone
#   peak (the simulator's static budget is conservative — live co-tenant peak was
#   16.3 GB total vs 22.5 GB declared at a smaller ctx).
#
# <think> handling: VibeThinker emits <think>...</think> into message.content
#   (plain Qwen2 ChatML is content-only in llama.cpp; reasoning_content stays
#   empty even with --reasoning-format deepseek). The caller's verifier must
#   strip closed <think> spans before parsing the final answer — the dispatch
#   helper does this.
#
# flash_attn required: --cache-type-v q8_0 needs flash attention.
#
# Port 7115 shared with vibethinker-3b-q8 (single) and -multi3 (runtime-
#   mutually-exclusive, same base URL). hermes-vibe uses THIS 4-role variant.

id: vibethinker-3b-q8-multi4
name: VibeThinker-3B Q8_0 Multi (N=4 roles, 98K/slot)
driver: llamacpp
port: 7115
vram_mb: 10000
context_size: 393216
kv_cache_per_1k: 16
model_id: prithivMLmods/VibeThinker-3B-GGUF
model_path: $HOME/bin/VibeThinker-3B.Q8_0.gguf
health_endpoint: /health
startup_timeout: 120
supports_sleep: false
sleep_mode: none
preflight_required: true
unit_vars:
  model_path: $HOME/bin/VibeThinker-3B.Q8_0.gguf
  context_size: 393216
  n_gpu_layers: -1
  jinja: true
  flash_attn: true
  extra_args: "--parallel 4 --cont-batching --threads 16 --cache-type-k q8_0 --cache-type-v q8_0 --temp 1.0 --top-p 0.95 --top-k 0"
