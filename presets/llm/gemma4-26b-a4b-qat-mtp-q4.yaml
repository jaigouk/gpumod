# Gemma 4 26B-A4B IT QAT UD-Q4_K_XL + Multi-Token Prediction drafter (gpumod-z0ks).
# Same target weights as gemma4-26b-a4b-qat-q4; this variant adds a separate
# MTP drafter GGUF for speculative decoding.
#
# Port 7110 is intentionally shared with gemma4-26b-a4b-qat-q4 (the non-MTP
# twin). The two presets are runtime-mutually-exclusive (same VRAM ceiling,
# can't both load) and share an OpenAI-compatible base URL, so swapping which
# preset is mode-active in `modes/hermes-agent.yaml` is a drop-in replacement
# for the downstream hermes-agent orchestrator (`~/.hermes/profiles/orchestrator/
# config.yaml` → base_url: http://localhost:7110/v1) without touching consumer
# config. Same coexistence pattern as gemma4-26b-a4b-q4 / -q4-multi on 7109.
#
# Drafter source: unsloth/gemma-4-26B-A4B-it-qat-GGUF (MTP/ subdir).
#   File:  $HOME/bin/gemma-4-26B-A4B-it-Q8_0-MTP.gguf   (462 MB, Q8_0)
#   Per Unsloth's MTP guide: Q8_0 is the smallest/recommended drafter quant.
#   Unlike the qwen36 MTP preset (single bundled GGUF), Gemma 4 ships the
#   drafter as a SEPARATE file pulled in via --model-draft.
#
# Requires llama.cpp >= PR ggml-org/llama.cpp#23398 (2026-06-07). Verified on
# host build fd3271e0b (2026-06-09) — also includes #24025 (Qwen post-norm),
# #24128 (-hf double-download fix), and #24282 (E2B/E4B assistants).
#
# Reported uplift (Unsloth): 1.4-2.2x throughput on GGUFs, 0.73 draft acceptance
# on B200. RTX 4090 numbers will differ and must be measured locally.
#
# Context: 262144 (256K) — Gemma 4 26B-A4B's native max per Unsloth's QAT page
# (https://unsloth.ai/docs/models/gemma-4/qat: "256K context" for 26B-A4B, no
# rope scaling required). Previous 262144 setting (2026-06-10, gpumod-z0ks)
# was a conservative initial choice; restored to 256K on 2026-06-14 because
# 64K (per-slot in the multi-slot variant) and even 128K weren't enough for
# real coding workloads in hermes-agent (large repo files + skill prompts
# eat context fast).
#
# vram_mb: 22000. Preflight RAMCheck adds +1500 MB MTP overhead + 512 MB
# margin on top of the declared budget; at 22000 the check resolves to
# 22000 + 1500 + 512 = 24012 < 24082 card total. Empirical peak budget
# breakdown at 256K (Gemma's 1024-token sliding-window attention keeps
# the linear scaling sub-linear — only sink layers allocate full-ctx KV):
#   model 13.6 + drafter 0.5 + mmproj 1.1 + target KV ~3.0 +
#   MTP-layer KV ~1.0 + runtime ~0.8 = ~20.0 GiB LLM-only
#   + embeddings co-tenant ~1.8 GiB = ~21.8 GiB total
# That leaves ~2.3 GiB headroom under the 24 GiB ceiling — tighter than
# the 131K config but acceptable for typical text-mode agent workloads.
# Multi-image conversations should be considered carefully; the
# image-token KV may push the budget — drop to 192K if a sustained
# workload trips OOM (preserving the long-coding-session benefit while
# trimming KV peak).

id: gemma4-26b-a4b-qat-mtp-q4
name: Gemma 4 26B-A4B IT QAT UD-Q4_K_XL + MTP (multimodal, 256K ctx)
driver: llamacpp
port: 7110
vram_mb: 22000
context_size: 262144
kv_cache_per_1k: 16
model_id: unsloth/gemma-4-26B-A4B-it-qat-GGUF
model_path: $HOME/bin/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
health_endpoint: /health
startup_timeout: 240
supports_sleep: false
sleep_mode: none
preflight_required: true
unit_vars:
  model_path: $HOME/bin/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
  context_size: 262144
  n_gpu_layers: -1
  jinja: true
  flash_attn: true
  # MTP flags per Unsloth MTP guide (https://unsloth.ai/docs/models/mtp):
  #   --model-draft         explicit drafter path (target is local, no -hf
  #                         auto-discovery available)
  #   --spec-type draft-mtp activates MTP speculative decoding
  #   --spec-draft-n-max 2  conservative starting point; sweep 1-6 later, do
  #                         not assume 2 is optimal (Unsloth: "try any value
  #                         from 1 through 6")
  # q8_0/q8_0 cache: llama.cpp #23646 ensures the MTP layer KV respects the
  # target's --cache-type-k setting. Same Gemma 4 sampler defaults as the
  # non-MTP twin (temp 1.0, top_p 0.95, top_k 64). Benchmark runner
  # overrides per-request via SamplerConfig.
  extra_args: "--parallel 1 --threads 16 --cache-type-k q8_0 --cache-type-v q8_0 --temp 1.0 --top-p 0.95 --top-k 64 --model-draft $HOME/bin/gemma-4-26B-A4B-it-Q8_0-MTP.gguf --spec-type draft-mtp --spec-draft-n-max 2 --mmproj $HOME/bin/gemma-4-26B-A4B-it-mmproj-BF16.gguf --chat-template-kwargs '{\"enable_thinking\":true}'"
