id: llama-3-1-8b
name: Llama 3.1 8B Instruct
driver: vllm
port: 8000
vram_mb: 8192
context_size: 8192
kv_cache_per_1k: 32
model_id: meta-llama/Llama-3.1-8B-Instruct
health_endpoint: /health
startup_timeout: 120
supports_sleep: true
sleep_mode: l1
unit_vars:
  gpu_mem_util: 0.9
  max_model_len: 8192

# gpumod-l20: driver venv compat (matches src/gpumod/compat/profiles/vllm-0.11.yaml).
# `gpumod doctor venv` enforces these at unit start; edit if your service
# uses a different venv.
compat:
  vllm: ">=0.11.0,<0.12"
  transformers: ">=4.55.2,<5.0"
  huggingface-hub: ">=0.34.0,<1.0"
  torch: ">=2.7.0,<3.0"
