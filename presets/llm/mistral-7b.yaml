id: mistral-7b
name: Mistral 7B Instruct v0.3
driver: vllm
port: 8000
vram_mb: 6144
context_size: 8192
kv_cache_per_1k: 28
model_id: mistralai/Mistral-7B-Instruct-v0.3
health_endpoint: /health
startup_timeout: 120
supports_sleep: true
sleep_mode: l1
unit_vars:
  gpu_mem_util: 0.85
  max_model_len: 8192

# gpumod-l20: driver venv compat (matches src/gpumod/compat/profiles/vllm-0.11.yaml).
# `gpumod doctor venv` enforces these at unit start; edit if your service
# uses a different venv.
compat:
  vllm: ">=0.11.0,<0.12"
  transformers: ">=4.55.2,<5.0"
  huggingface-hub: ">=0.34.0,<1.0"
  torch: ">=2.7.0,<3.0"
