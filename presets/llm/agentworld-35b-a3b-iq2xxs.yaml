# Qwen-AgentWorld-35B-A3B — Unsloth Dynamic UD-IQ2_XXS (co-host PoC tier, 2026-06-25).
#
# PURPOSE: the AgentWorld-simulator + Gemma-agent CO-HOST PoC (beads qwen-5q6.1). The smallest
#   quant so BOTH models fit on the 24 GB 4090 at once. ~2-bit → INFRA / STEPS ONLY: it simulates
#   BADLY. Real simulator quality is Q8-on-Colab; this only proves the procedure.
#
# Arch: same as agentworld-35b-a3b-q4 — Qwen3_5MoeForConditionalGeneration / qwen35moe (hybrid
#   Gated-DeltaNet + Gated-Attention, 40 layers, 256 experts A3B). GGUF arch "qwen35moe", runtime
#   supported since llama.cpp b7990 (host build 9784). NO --override-kv (defect fixed in Unsloth build).
#
# File: Qwen-AgentWorld-35B-A3B-UD-IQ2_XXS.gguf (10.71 GiB, 11,496,840,448 B).
#   gpumod VRAM estimate ~12.06 GB. Co-host budget: this (~13 GB) + gemma4-e2b-qat-q4 (6 GB)
#   = ~19 GB < 24 GB. Serve both via mode `agentworld-poc`.
#
# context_size 16384: PoC rollouts are short — keep KV small so the co-host fits with headroom.
#   (The standalone agentworld-35b-a3b-q4 preset runs 131072 for full AgentWorldBench coverage;
#   not needed here.) f16 KV (no --cache-type/--flash-attn) for max robustness in the co-host.

id: agentworld-35b-a3b-iq2xxs
name: Qwen-AgentWorld-35B-A3B UD-IQ2_XXS (PoC co-host)
driver: llamacpp
port: 7111
vram_mb: 13000           # ~12.06 GB est + KV @ 16K + runtime; preflight floor
context_size: 16384
kv_cache_per_1k: 16
model_id: unsloth/Qwen-AgentWorld-35B-A3B-GGUF
model_path: $HOME/bin/Qwen-AgentWorld-35B-A3B-UD-IQ2_XXS.gguf
health_endpoint: /health
startup_timeout: 240
supports_sleep: false
sleep_mode: none
preflight_required: true  # gpumod-ecr: vram_mb >= 10000
unit_vars:
  model_path: $HOME/bin/Qwen-AgentWorld-35B-A3B-UD-IQ2_XXS.gguf
  context_size: 16384
  n_gpu_layers: -1
  jinja: true
  # Unsloth card world-model sampling (temp 0.6 / top_p 0.95 / top_k 20). f16 KV (no cache-type
  # / flash-attn) for co-host robustness; the notebook overrides sampling per-request anyway.
  extra_args: "--parallel 1 --threads 8 --temp 0.6 --top-p 0.95 --top-k 20"
