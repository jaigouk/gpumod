# Qwen3.5-35B-A3B UD-Q3_K_XL Multi-Agent Configuration
# MoE model with 3B active params - optimized for 3 parallel agents with larger context
# Source: unsloth/Qwen3.5-35B-A3B-GGUF
# Comparison: Lower quant than Q4_K_XL but more VRAM headroom for KV cache

id: qwen35-35b-a3b-q3-multi
name: Qwen3.5-35B-A3B Q3 Multi-Agent
driver: llamacpp
port: 7081
vram_mb: 18000
context_size: 40960
kv_cache_per_1k: 64
model_id: unsloth/Qwen3.5-35B-A3B-GGUF
model_path: $HOME/bin/Qwen3.5-35B-A3B-UD-Q3_K_XL.gguf
health_endpoint: /health
startup_timeout: 120
supports_sleep: false
sleep_mode: none
unit_vars:
  model_path: $HOME/bin/Qwen3.5-35B-A3B-UD-Q3_K_XL.gguf
  context_size: 40960
  n_gpu_layers: -1
  jinja: true
  extra_args: "--parallel 3 --cont-batching --threads 16"
