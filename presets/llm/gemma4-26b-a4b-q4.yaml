# Gemma 4 26B-A4B IT UD-IQ4_XS — added mid-benchmark (gpumod-h6gs).
# MoE: 26B total, 4B active per token. A4B = "Active 4B" (Google's MoE naming).
# This is the Gemma analog to Qwen's 35B-A3B (MoE same size class).
# Source: unsloth/gemma-4-26B-A4B-it-GGUF
#
# Non-speculative: this is the standalone variant, NOT the gemma-4-26B-A4B-it-assistant
# drafter pair. Even if we wanted MTP, ggml-org/llama.cpp PR #23398 (gemma4_assistant
# arch support) is still WIP — the merged impl lives only in the ik_llama.cpp fork.

id: gemma4-26b-a4b-q4
name: Gemma 4 26B-A4B IT UD-IQ4_XS
driver: llamacpp
port: 7109
vram_mb: 18000
context_size: 131072
kv_cache_per_1k: 16
model_id: unsloth/gemma-4-26B-A4B-it-GGUF
model_path: $HOME/bin/gemma-4-26B-A4B-it-UD-IQ4_XS.gguf
health_endpoint: /health
startup_timeout: 240
supports_sleep: false
sleep_mode: none
preflight_required: true
unit_vars:
  model_path: $HOME/bin/gemma-4-26B-A4B-it-UD-IQ4_XS.gguf
  context_size: 131072
  n_gpu_layers: -1
  jinja: true
  flash_attn: true
  # Unsloth-recommended sampling defaults for Gemma 4 (temp 1.0, top_p 0.95,
  # top_k 64). Benchmark runner overrides per-request via SamplerConfig.
  extra_args: "--parallel 1 --threads 16 --cache-type-k q8_0 --cache-type-v q8_0 --temp 1.0 --top-p 0.95 --top-k 64 --chat-template-kwargs '{\"enable_thinking\":true}'"
