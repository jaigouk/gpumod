# Qwen3.6-27B-MTP UD-Q4_K_XL — Multi-Token Prediction (speculative decoding)
# Source: unsloth/Qwen3.6-27B-MTP-GGUF
# Note: dense architecture (NOT MoE), all 27B params active. MTP gives ~1.4-2.2x speedup.
# MTP constraints: --parallel 1 required, --mmproj unsupported, needs llama.cpp >= b9297.
# Companion preset: qwen36-27b-q4 (non-MTP twin on port 7100).

id: qwen36-27b-mtp-q4
name: Qwen3.6-27B MTP Q4
driver: llamacpp
port: 7102
vram_mb: 19000
context_size: 40960
kv_cache_per_1k: 64
model_id: unsloth/Qwen3.6-27B-MTP-GGUF
model_path: $HOME/bin/Qwen3.6-27B-MTP-UD-Q4_K_XL.gguf
health_endpoint: /health
startup_timeout: 180
supports_sleep: false
sleep_mode: none
preflight_required: true
unit_vars:
  model_path: $HOME/bin/Qwen3.6-27B-MTP-UD-Q4_K_XL.gguf
  context_size: 40960
  n_gpu_layers: -1
  jinja: true
  # NOTE: --flash-attn passed through extra_args because b9297 changed it from
  # boolean to requires-value (on|off|auto). The template's `flash_attn: true`
  # opt-in renders a bare flag and crashes on b9297+. Follow-up: fix template.
  extra_args: "--parallel 1 --threads 16 --flash-attn on --spec-type draft-mtp --spec-draft-n-max 2"
