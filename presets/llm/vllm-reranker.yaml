id: vllm-reranker
name: Qwen3-VL-Reranker-2B
driver: vllm
port: 8201
vram_mb: 6000
context_size: 512
model_id: Qwen/Qwen3-VL-Reranker-2B
health_endpoint: /health
startup_timeout: 120
supports_sleep: true
sleep_mode: l2
unit_vars:
  gpu_mem_util: 0.25
  max_model_len: 512
  max_num_seqs: 8
  dtype: float16
  enforce_eager: true
  runner: pooling
  enable_sleep_mode: true
  sleep_level: 2
  hf_overrides: '{"architectures": ["Qwen3VLForSequenceClassification"], "classifier_from_token": ["no", "yes"], "is_original_qwen3_reranker": true}'

# gpumod-l20: driver venv compat (matches src/gpumod/compat/profiles/vllm-0.11.yaml).
# `gpumod doctor venv` enforces these at unit start; edit if your service
# uses a different venv.
compat:
  vllm: ">=0.11.0,<0.12"
  transformers: ">=4.55.2,<5.0"
  huggingface-hub: ">=0.34.0,<1.0"
  torch: ">=2.7.0,<3.0"
