# Gemma 4 E2B IT QAT UD-Q2_K_XL — small model for fast benchmark-harness dev
# (gpumod-kpmq epic: AgentWorld distillation into Gemma 4).
# Dense Gemma 4 E2B (MatFormer, ~2.3B effective / ~5.1B w/ embeddings, 35 layers).
# Source: unsloth/gemma-4-E2B-it-qat-mobile-GGUF — the mobile repo ships the full
# model ONLY as UD-Q2_K_XL (2-bit, 2.04 GB); the other files are MTP drafters + mmproj.
# 2-bit is aggressive — fine for harness validation / fast iteration, weak as a quality
# baseline. For a quality E2B baseline use a higher-bit E2B QAT from the non-mobile repo.

id: gemma4-e2b-qat-q2
name: Gemma 4 E2B IT QAT UD-Q2_K_XL
driver: llamacpp
port: 7112
vram_mb: 4000        # ~2.3 GB weights + small KV + runtime; tiny model
context_size: 65536  # > coding suite max_tokens=32768; KV cheap on E2B
model_id: unsloth/gemma-4-E2B-it-qat-mobile-GGUF
model_path: $HOME/bin/gemma-4-E2B-it-qat-UD-Q2_K_XL.gguf
health_endpoint: /health
startup_timeout: 120
supports_sleep: false
sleep_mode: none
preflight_required: false  # gpumod-ecr: only required for vram_mb >= 10000; E2B is tiny
unit_vars:
  model_path: $HOME/bin/gemma-4-E2B-it-qat-UD-Q2_K_XL.gguf
  context_size: 65536
  n_gpu_layers: -1
  jinja: true
  flash_attn: true
  # Unsloth-recommended Gemma 4 sampling defaults (temp 1.0, top_p 0.95, top_k 64).
  # Benchmark runner overrides per-request via SamplerConfig (GEMMA_CODING).
  extra_args: "--parallel 1 --threads 16 --cache-type-k q8_0 --cache-type-v q8_0 --temp 1.0 --top-p 0.95 --top-k 64 --chat-template-kwargs '{\"enable_thinking\":true}'"
