# Gemma 4 12B IT UD-Q4_K_XL — for gpumod-h6gs benchmark vs qwen36-35b-a3b-mtp-iq4xs-preserve.
# Source: unsloth/gemma-4-12b-it-GGUF
# Dense 12B with hybrid attention (sliding-window local + full global) and thinking mode.
# No MTP variant exists for Gemma 4 12B (Google released drafters only for E2B/E4B/26B-A4B/31B,
# and mainline llama.cpp does not yet support the gemma4_assistant arch — ggml-org PR #23398
# is WIP). This preset runs non-speculative; the benchmark documents that asymmetry.

id: gemma4-12b-q4
name: Gemma 4 12B IT UD-Q4_K_XL
driver: llamacpp
port: 7106
vram_mb: 14000
context_size: 131072
kv_cache_per_1k: 16
model_id: unsloth/gemma-4-12b-it-GGUF
model_path: $HOME/bin/gemma-4-12b-it-UD-Q4_K_XL.gguf
health_endpoint: /health
startup_timeout: 180
supports_sleep: false
sleep_mode: none
preflight_required: true
unit_vars:
  model_path: $HOME/bin/gemma-4-12b-it-UD-Q4_K_XL.gguf
  context_size: 131072
  n_gpu_layers: -1
  jinja: true
  flash_attn: true
  # Matches qwen36-35b-a3b-mtp-iq4xs-preserve's KV-cache strategy (q8_0 at 128K) for
  # an apples-to-apples production-aligned comparison. No --spec-type (no MTP available).
  # enable_thinking:true matches the Qwen baseline's thinking-mode runs; Gemma 4 uses
  # the same chat-template kwarg name (verified on the google/gemma-4-12B-it model card).
  # Unsloth-recommended sampling defaults for Gemma 4 (temp 1.0, top_p 0.95,
  # top_k 64). Benchmark runner overrides per-request via SamplerConfig, so
  # these only apply to non-benchmark direct chat.
  extra_args: "--parallel 1 --threads 16 --cache-type-k q8_0 --cache-type-v q8_0 --temp 1.0 --top-p 0.95 --top-k 64 --chat-template-kwargs '{\"enable_thinking\":true}'"
