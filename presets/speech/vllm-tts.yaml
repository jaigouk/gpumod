id: vllm-tts
name: Qwen3-TTS-12Hz-0.6B-CustomVoice
driver: vllm
port: 8204
vram_mb: 5000
model_id: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
health_endpoint: /health
startup_timeout: 120
supports_sleep: false
sleep_mode: none
unit_vars:
  gpu_mem_util: 0.2
  enforce_eager: true
  trust_remote_code: true
  omni: true

# gpumod-l20: driver venv compat (matches src/gpumod/compat/profiles/vllm-0.11.yaml).
# `gpumod doctor venv` enforces these at unit start; edit if your service
# uses a different venv.
compat:
  vllm: ">=0.11.0,<0.12"
  transformers: ">=4.55.2,<5.0"
  huggingface-hub: ">=0.34.0,<1.0"
  torch: ">=2.7.0,<3.0"
