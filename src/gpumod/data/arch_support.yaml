# llama.cpp architecture support matrix
# Maps model architecture to minimum llama.cpp build number required.
# Source: https://github.com/ggml-org/llama.cpp/releases
#
# Part of gpumod-h1c: Architecture compatibility check.

architectures:
  # Core architectures - always supported
  llama:
    min_version: 1000
    notes: "Original LLaMA architecture"

  # Qwen family
  qwen2:
    min_version: 5000
    notes: "Qwen 2.x series"
  qwen2moe:
    min_version: 6500
    notes: "Qwen 2.x MoE variants"
  qwen35moe:
    min_version: 7900
    notes: "Qwen 3.5 MoE - requires b7900+"

  # DeepSeek
  deepseek2:
    min_version: 7500
    notes: "DeepSeek V2 MoE"

  # Mistral/Mixtral
  mistral:
    min_version: 3000
    notes: "Mistral 7B and variants"
  mixtral:
    min_version: 4500
    notes: "Mixtral MoE models"

  # Other popular architectures
  phi3:
    min_version: 6000
    notes: "Microsoft Phi-3"
  gemma:
    min_version: 5500
    notes: "Google Gemma"
  gemma2:
    min_version: 7000
    notes: "Google Gemma 2"
  gemma3n:
    min_version: 9290
    notes: "Google Gemma 4 nano (E2B/E4B) - uses gemma3n arch in llama.cpp"
  gemma4:
    min_version: 9500
    notes: "Google Gemma 4 dense (12B/26B-A4B/31B) - requires b9500+ for the
            FPE fix in mtmd (PR #24088, merged 2026-06-03). Earlier builds
            (b9297 and prior) can FPE-crash mid-decode on the 12B GGUF."
  starcoder2:
    min_version: 5800
    notes: "StarCoder 2"
  command-r:
    min_version: 6200
    notes: "Cohere Command-R"
