# Driver venv compatibility profile for vllm 0.11.x (gpumod-ng7).
#
# Use this in a service preset like:
#
#   compat:
#     vllm: '>=0.11.0,<0.12'
#     transformers: '>=4.55.2,<5.0'
#     huggingface-hub: '>=0.34.0,<1.0'
#
# Or have the operator copy this whole block, edit it, and paste into
# the preset YAML. The shipped values reflect a known-good combination
# verified against a production install where vllm 0.11 must coexist
# with consumers that require huggingface-hub <1.0 (transformers 4.x).

id: vllm-0.11
description: |
  Known-good package combination for vllm 0.11.x running in a dedicated
  venv. Pairs transformers 4.x with huggingface-hub <1.0; rejects
  transformers 5.x (which removed Qwen2Tokenizer.all_special_tokens_extended
  that vllm 0.11 relies on).

compat:
  vllm: ">=0.11.0,<0.12"
  transformers: ">=4.55.2,<5.0"
  huggingface-hub: ">=0.34.0,<1.0"
  torch: ">=2.7.0,<3.0"
