# gpumod stability sysctl tunings (gpumod-ej0).
#
# Install:  sudo cp scripts/gpumod-stability.conf /etc/sysctl.d/99-gpumod-stability.conf
#           sudo sysctl --system
#   or:     sudo scripts/install-gpumod-sysctl.sh
#
# Background: bumps vm.min_free_kbytes from the default (~66 MiB on a
# 30 GiB host) to 1 GiB so the kernel proactively keeps more high-order
# contiguous pages free. This reduces the probability that cudaHostAlloc
# (CUDA pinned memory) hangs the NVIDIA driver under memory fragmentation.
# See docs/research/20260525_oom_protection_findings/FINDINGS.md for the
# broader pinned-memory freeze class.

vm.min_free_kbytes=1048576
