# gpumod-x7rv: protect code-server from OOM events caused by LLM model loads.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/code-server@.service.d
#   sudo cp <this-file> /etc/systemd/system/code-server@.service.d/10-oom-protect.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart code-server@<user>
#
# Verify after install:
#   systemctl show code-server@<user> -p MemoryMin,MemoryLow,MemorySwapMax,OOMScoreAdjust,ManagedOOMMemoryPressure
#
# Rationale (each layer is independent — defense in depth):
#  - MemoryMin: physical RAM the kernel guarantees stays resident. Page cache
#    of code-server's node binary + extension hosts won't be reclaimed even
#    under severe memory pressure.
#  - MemoryLow: soft target. The kernel reclaims here only after all
#    unprotected cgroups are exhausted.
#  - MemorySwapMax: hard ceiling on swap this cgroup may consume. Bounds the
#    blast radius of a leaky extension host (e.g. the 2026-06-03 Claude Code
#    VS Code extension leak, claude-code#19223) — past the cap the kernel
#    triggers in-cgroup OOM-kill, which picks the heaviest process (the leaky
#    extension), leaving the main code-server node alive so the operator
#    keeps their SSH/web connection.
#  - OOMScoreAdjust=-900: in the unlikely event the kernel OOM-killer runs
#    (i.e. systemd-oomd was bypassed and we hit real OOM), code-server is
#    last in line.
#  - ManagedOOMMemoryPressure=avoid: explicit opt-out from systemd-oomd's
#    PSI-based killing.
#  - Restart=always with short RestartSec: if it ever does die, comes back
#    within 2 seconds so the user's SSH/web connection recovers.
#
# Sizing: code-server's node + extension hosts use ~1.5 GiB resident on a
# typical host. MemoryMin=1G covers the always-resident main process;
# MemoryLow=2G adds headroom for the extensions before pressure-eviction begins.
# MemorySwapMax=8G matches the gitea-runner total-memory cap pattern; leaves
# the remainder of the 64 GiB zvol swap available for the rest of the system.

[Service]
MemoryMin=1G
MemoryLow=2G
MemorySwapMax=8G
OOMScoreAdjust=-900
ManagedOOMMemoryPressure=avoid
ManagedOOMSwap=avoid
Restart=always
RestartSec=2s
