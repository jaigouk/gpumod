# gpumod-x7rv: tune systemd-oomd to act fast on LLM memory pressure.
#
# Install:
#   sudo mkdir -p /etc/systemd/oomd.conf.d
#   sudo cp <this-file> /etc/systemd/oomd.conf.d/gpumod.conf
#   sudo systemctl restart systemd-oomd
#
# Verify after install:
#   systemd-analyze cat-config systemd/oomd.conf
#   systemctl show systemd-oomd
#
# What this changes vs systemd defaults:
#   DefaultMemoryPressureLimit:        60% (unchanged — kept conservative)
#   DefaultMemoryPressureDurationSec:  20s (was 30s) — kill 33% faster when
#                                            PSI is sustained, reducing the
#                                            window where the kernel OOM
#                                            killer could fire first
#   SwapUsedLimit:                     90% (unchanged)
#
# Rationale: in Phase 4 testing, PSI hit 10% at 15 GiB MemAvailable during
# a model load. The default 30s would have given a fast-rising pressure
# event 30 seconds to potentially cascade into kernel OOM territory.
# 20s is a safer reaction time for our workload, but not so short that
# normal compile bursts get killed.

[OOM]
DefaultMemoryPressureLimit=60%
DefaultMemoryPressureDurationSec=20s
SwapUsedLimit=90%
