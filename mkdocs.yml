site_name: gpumod
site_url: https://jaigouk.com/gpumod
site_description: >-
  GPU Service Manager for ML workloads on Linux/NVIDIA systems.
  Manage vLLM, llama.cpp, FastAPI, and Docker inference services with
  VRAM simulation, mode switching, and MCP integration.
site_author: Jaigouk Kim
repo_url: https://github.com/jaigouk/gpumod
repo_name: jaigouk/gpumod
copyright: Copyright &copy; 2026 Jaigouk Kim

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
    - announce.dismiss
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      separator: '[\s\-\.]+'
      lang: en
  - exclude:
      glob:
        - internal/**
        - gpumod-5min.md
        - beads_templates/**
  - social:
      cards_layout: default/variant
  - tags

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jaigouk/gpumod
      name: gpumod on GitHub
  generator: false
  analytics:
    provider: google
    property: ""
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences,
      as well as to measure the effectiveness of our documentation and
      whether users find what they're searching for. With your consent,
      you're helping us to make our documentation better.

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - abbr
  - pymdownx.snippets
  - pymdownx.mark
  - pymdownx.keys
  - meta

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - CLI Reference: getting-started/cli.md
      - Configuration: getting-started/configuration.md
  - User Guide:
      - MCP Integration: user-guide/mcp.md
      - MCP Workflows: user-guide/mcp-workflows.md
      - AI Planning: user-guide/ai-planning.md
      - Venv Isolation: user-guide/venv-isolation.md
  - Architecture:
      - architecture/index.md
      - Security: architecture/SECURITY.md
  - Design:
      - Docker Driver: design/docker-driver.md
      - Health Monitor: design/health-monitor.md
      - TUI Security: design/tui-security.md
  - Benchmarks:
      - Methodology: benchmarks/README.md
      - "Gemma 4 (12B + 26B-A4B) vs Qwen3.6-MTP (2026-06-04)": benchmarks/20260603_gemma4_12b_vs_qwen36_35b_a3b_mtp/README.md
      - "Qwen3.6 baseline vs Qwen3.5 Heretic (2026-05-26)": benchmarks/20260526_qwen36_mtp_vs_qwen35_heretic/README.md
      - "Qwen3.6 MTP vs Non-MTP — Hermes-Agent Swap (2026-05-24)": benchmarks/20260524_qwen36_mtp_vs_a3b/README.md
      - "Qwen3.6 vs Gemma4 Architecture Comparison (2026-04-23)": benchmarks/20260423_qwen36_gemma4_comparison/README.md
      - "Qwen3.5 IQ4_XS: HauhauCS vs AesSedai (2026-03-11)": benchmarks/20260311_hauhaucs_vs_aessedai/README.md
      - "Qwen3.5 Job Queue Challenge (2026-02-26)": benchmarks/20260226_qwen35_job_queue_challenge/README.md
      - "Qwen3.5-35B-A3B Provider Comparison (2026-02-26)": benchmarks/20260226_qwen35_35b_a3b_provider_comparison/README.md
      - "Qwen3.5 27B vs 35B (2026-02-25)": benchmarks/20260225_qwen35_comparison/README.md
      - "Qwen3-Coder vs Qwen3.5 (2026-02-25)": benchmarks/20260225_qwen3_vs_qwen35/README.md
      - "Qwen3.5 Quant Comparison (2026-02-25)": benchmarks/20260225_qwen35_quant_comparison/README.md
      - "Mixed Workload — Quality vs Concurrency (2026-02-22)": benchmarks/20260222_mixed_workload/README.md
      - "Multi-Agent: GPT-OSS 20B vs Qwen3-Coder vs Qwen3-Coder-Next (2026-02-14)": benchmarks/20260214_multi_agent/README.md
      - "Nemotron vs Devstral (2026-02-07)": benchmarks/20260207_nemotron_devstral/20260207_nemotron_devstral_report.md
  - Research:
      - "Slot Save/Restore for Multi-Agent Gemma 4 (2026-06-05)": research/20260605_slot_persistence/README.md
      - "Multi-Agent Capacity Spike — hermes-agent (2026-06-04)": research/20260604_multi_agent_hermes_capacity/README.md
      - "OOM Protection: cudaHostAlloc Freeze Class (2026-05-25)": research/20260525_oom_protection_findings/FINDINGS.md
      - "KV Cache Estimation Redesign (2026-05-24)": research/20260524_kv_estimation_redesign.md
      - "preserve_thinking vs enable_thinking (2026-05-24)": research/20260524_preserve_thinking_findings.md
      - "TriAttention Viability — NVIDIA + Gemma 4 (2026-04-19)": research/20260419_triattention_viability.md
  - Contributing: contributing.md
